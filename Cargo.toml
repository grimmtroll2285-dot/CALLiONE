[package]
name = "titan-core"
version = "1.1.0-dev"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace]
members = [".", "crates/titan-core-pkg"]

[features]
# Stage 2 of ps5/build.sh: embeds stage 1 (env TITAN_SELF_ELF) to save it as the tile's copy.
self-copy = []
unified-stack = []

[dependencies]
titan-core-pkg = { path = "crates/titan-core-pkg" }
libc = "0.2.187"
serde_json = "1"
sha2 = { version = "=0.10.9", default-features = false }

# Block decoding is hot during cache builds.
[profile.release.package.titan-core-pkg]
opt-level = 3

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
strip = true

